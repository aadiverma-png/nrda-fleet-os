# NRDA fleet roster and sleeping bays (map frame = Gazebo world frame, metres, radians)
#
# Robot ids are AMR_1 ... AMR_20 (model type amr_01). Each robot spawns docked at a station:
# 10 at chargers spread over the building, 10 in sleeping bays ("dog houses", models/nrda_parking_bay)
# along the walls: REST_W1-5 on the west side (reverse in from corridor VW, nose east) and
# REST_E1-5 on the east side between corridors VE and VE2 (reverse in from VE, nose west). Idle robots return to them.

