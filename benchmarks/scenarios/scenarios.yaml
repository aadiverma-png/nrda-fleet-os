# NRDA-FA scenario benchmarks (2-D simulator, NRDS warehouse, AMR-01 fleet).
# Every scenario runs for `duration` simulated seconds with the fleet from
# ros2_ws/src/nrds_warehouse_sim/config/fleet.yaml (AMR_1 ... AMR_<robots>).
#
# tasks: number of transport tasks, released as a Poisson stream at `rate` per minute
# comm_loss: average peer-message loss (Gilbert-Elliott bursts)
# blockages: pallets dropped in aisle lanes at t_on (x, y, t_on, t_off)
# failures: robots that stop dead and go silent at time t
S1_nominal:
  description: Nominal order flow, 20 robots
  robots: 20
  tasks: 60
  rate: 8
  duration: 600
S2_blockages:
  description: Nominal flow plus four pallets dropped in busy cross-aisle lanes
  robots: 20
  tasks: 60
  rate: 8
  duration: 600
  blockages:
    - [-8.95, -2.0, 60, 400]
    - [8.55, 14.0, 90, 450]
    - [12.05, -10.0, 120, 500]
    - [-15.95, 6.0, 150, 520]
S3_busy:
  description: Peak load, 20 robots
  robots: 20
  tasks: 120
  rate: 16
  duration: 600
S4_lossy_comms:
  description: Nominal flow with 20 % burst loss on the peer radio
  robots: 20
  tasks: 60
  rate: 8
  duration: 600
  comm_loss: 0.2
S5_robot_failure:
  description: Nominal flow, two robots fail mid-mission
  robots: 20
  tasks: 60
  rate: 8
  duration: 600
  failures:
    - [AMR_4, 150]
    - [AMR_12, 240]
S6_density_10:
  description: Density sweep, 10 robots
  robots: 10
  tasks: 60
  rate: 8
  duration: 600
